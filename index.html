<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShootRadar</title>
<meta name="description" content="Events worth shooting in South Africa, and photo galleries your clients open from a QR code.">
<meta name="theme-color" content="#1b1814">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1814'/%3E%3Cpath d='M7 12V7h5M25 12V7h-5M7 20v5h5M25 20v5h-5' stroke='%23f7f3ea' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f2a33a'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try { var t = localStorage.getItem("sr.theme"); if (t === '"light"' || t === '"dark"') document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="#/events" aria-label="ShootRadar home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 14V6h8M34 14V6h-8M6 26v8h8M34 26v8h-8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="5.5" class="logo-dot"/></svg>
      <span>ShootRadar</span><em>Pilot</em>
    </a>
    <div class="top-tools">
      <nav class="nav" aria-label="Sections" id="nav">
        <a href="#/events" data-nav="events">Events</a>
        <a href="#/galleries" data-nav="galleries">My galleries</a>
        <a href="#/profile" data-nav="profile">Profile</a>
      </nav>
      <button class="tbtn js-install" type="button" hidden>Install app</button>
      <button class="tbtn" type="button" id="theme" aria-label="Colour theme">Theme: system</button>
    </div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1"></main>

<footer class="foot" id="foot">
  <div class="wrap">
    <p id="foot-data"></p>
    <p>Not legal advice. POPIA needs consent before you photograph or message someone, and a parent's consent for anyone under 18.</p>
    <p><a id="foot-help" target="_blank" rel="noopener">Report a problem on WhatsApp</a></p>
    <p><button class="btn sm line js-install" type="button" hidden>Install ShootRadar as an app</button></p>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="lightbox" class="lightbox" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/vendor/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
